name: PR Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_tags:
        description: 'Comma-separated tags to include (default: smoke,regression)'
        required: false
        default: 'smoke,regression'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
      TODOIST_SHARE_TEST_EMAIL: ${{ secrets.TODOIST_SHARE_TEST_EMAIL }}
      TODOIST_STORAGE_STATE_B64: ${{ secrets.TODOIST_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          rfbrowser init

      - name: Restore Playwright storage state (UI login session)
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:TODOIST_STORAGE_STATE_B64)
          [IO.File]::WriteAllBytes('storageState.json', $bytes)

      - name: Run tests (tags selectable via workflow_dispatch; known_defect always excluded)
        shell: pwsh
        run: |
          $tagsInput = "${{ github.event.inputs.include_tags }}"
          if (-not $tagsInput) { $tagsInput = 'smoke,regression' }
          $tags = $tagsInput -split ',' | ForEach-Object { $_.Trim() }
          ./run-tests.ps1 -Suite all -Include $tags -Exclude known_defect -ResultsDir results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
